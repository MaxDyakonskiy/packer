#_preseed_V1
# За основу взяты стандартные preseed-файлы для ALSE 1.7 и Debian Bookworm, пример preseed-файла с сайта Packer, а также ответы с debconf на системе, где была установлена ALSE 1.7. У ALSE есть вопросы, которых нет в Debian, поэтому нельзя использовать просто дебиановский файл.

#Сетевой репозиторий для установки
d-i mirror/protocol string http
d-i mirror/http/hostname string download.astralinux.ru
d-i mirror/http/directory string /astra/stable/1.7_x86-64/repository-update

# Выбор компонент репозитория
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select none
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean false

# Настройки языка
d-i mirror/country string manual
d-i debian-installer/locale string ru_RU
d-i debian-installer/locale select ru_RU.UTF-8
d-i debian-installer/language string ru
d-i debian-installer/country string RU
d-i debian-installer/keymap string ru
d-i localechooser/supported-locales multiselect en_US.UTF-8

# Настройки клавиатуры
d-i console-tools/archs select at
d-i console-keymaps-at/keymap select ru
d-i console-setup/toggle string Alt+Shift
d-i console-setup/layoutcode string ru
d-i keyboard-configuration/toggle select Alt+Shift
d-i keyboard-configuration/layoutcode string ru
d-i keyboard-configuration/xkb-keymap select ru
d-i languagechooser/language-name-fb select Russian
d-i countrychooser/country-name select Russia

# Настройки сетевого интерфейса
# Нам необходима сеть, чтобы достучаться до локального HTTP-сервера, который будет
# развернут Packer-ом для получения preseed-файла
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select lo

# Настройка часов и синхронизации времени
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Moscow

# Определяет, нужно ли использовать NTP для установки часов во время установки
d-i clock-setup/ntp boolean true

# Используемый сервер NTP. Значение по умолчанию указывается здесь. Для примера указан сервер ВНИИФТРИ.
d-i clock-setup/ntp-server string ntp4.vniiftri.ru

# Разметка диска
# Предполагается, что в билдере Packer мы указываем 'disk_interface = "virtio"', чтобы использовать не эмуляцию традиционных интерфейсов (префиксы hd, sd), а паравиртуализацию (префикс vd). См. подробнее здесь: https://pve.proxmox.com/wiki/Qemu/KVM_Virtual_Machines. 
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-target/mount_failed         boolean true
d-i partman-basicfilesystems/no_swap    boolean false
d-i partman/confirm_write_new_label     string true
d-i partman-partitioning/unknown_label  boolean true

# Установка ядра: выбираем пакет с ядром для Термидеска 5.0. Для Бреста и ALDPro понадобится создать другие preseed-файлы и указать подходящие для них версии ядра.
d-i base-installer/kernel/image string linux-image-6.1.50-1-generic

# Учетная запись и пароль пользователя: указываем пару для тестового стенда.
# Используем хеш SHA512, используя команду:
#'mkpasswd -m sha512crypt -S $(pwgen -ns 16 1) mypassword'
#(https://unix.stackexchange.com/questions/225217/what-hash-algorithms-can-i-use-in-preseeds-passwd-user-password-crypted-entry)
#Пароль можете узнать у коллег, он стандартный для обычного пользователя и рута
d-i passwd/make-user boolean true
d-i passwd/user-fullname string adminlocal
d-i passwd/username string adminlocal
d-i passwd/user-password-crypted password $6$Bb8yhdLhFGRM3JWl$9FuhFEI.aIEy9fCxz7o.W1ge5tlcWJU/c0T5AwFTN0IMeZcBXd6iVdyx3G0US0ARsjY6jbRSjGRSamBHsa7Z81

d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$Bb8yhdLhFGRM3JWl$9FuhFEI.aIEy9fCxz7o.W1ge5tlcWJU/c0T5AwFTN0IMeZcBXd6iVdyx3G0US0ARsjY6jbRSjGRSamBHsa7Z81

# Выбор ПО для установки
tasksel	tasksel/first multiselect \
Fly desktop, Internet suite, Base packages, SSH server, Virtualization tools
tasksel tasksel/astra-feat-setup multiselect

# Выбор уровня защищенности и параметров ОС. В частности, отключаем
#мандатный контроль целостности: он не нужен на стенде и будет мешать
d-i astra-additional-setup/os-check select Maximum security level Smolensk
d-i astra-additional-setup/additional-settings-smolensk multiselect \
Disable Mandatory Integrity Control, Disable Mandatory Access Control, \
Disable ptrace capability, Disable automatic network configuration

# Разное
#astra-license astra-license/license boolean true
krb5-config krb5-config/kerberos_servers string
libnss-ldapd libnss-ldapd/ldap-base string
libnss-ldapd libnss-ldapd/ldap-uris string
libnss-ldapd libnss-ldapd/nsswitch multiselect services
ald-client ald-client/make_config boolean false
ald-client ald-client/manual_configure false
astra-feat-setup astra-feat-setup/feat multiselect kiosk mode false
astra-feat-setup astra-feat-setup/feat multiselect Служба ALD false
d-i console-cyrillic/switch select "Клавиша Menu"
d-i console-cyrillic/toggle select Control+Shift
d-i samba-common/dhcp boolean false
d-i samba-common/workgroup string termidesk
popularity-contest popularity-contest/participate boolean false

# Загрузчик GRUB: хешируем пароль через MD5, как это указано в мануале Дебиана
d-i grub-installer/bootdev string /dev/vda
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/password-crypted password $1$AbGQ5/$6fRVsL20nGfk7CzMnZLp60

# Устанавливаем нужные пакеты для Бреста
d-i preseed/late_command string \
in-target echo 'deb https://download.astralinux.ru/astra/stable/1.7_x86-64/repository-update/ 1.7_x86-64 main contrib non-free' > /etc/apt/sources.list; \
in-target apt update; \
in-target apt install -y one-context; \
in-target apt install -y spice-vdagent; \
in-target apt install -y qemu-guest-agent; \
in-target apt install -y xserver-xorg-video-qxl; \
in-target apt install -y xrdp; \
in-target apt purge -y ntp; \
in-target systemctl enable systemd-timesyncd.service; \
in-target systemctl disable systemd-networkd.service; \
in-target systemctl mask systemd-networkd.service; \
in-target rm -f /etc/NetworkManager/system-connections/*

# Завершение установки
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
d-i finish-install/exit/poweroff boolean true